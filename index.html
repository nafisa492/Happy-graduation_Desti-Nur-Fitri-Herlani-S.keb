<!DOCTYPE html>
<html lang="id" style="color-scheme: only light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>Happy Graduation!</title>
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Space+Mono&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#f1efe8;font-family:'Outfit',sans-serif;color:#222}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.screen.on{display:flex;animation:fade .8s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hand{font-family:'Covered By Your Grace','Segoe Script',cursive}

/* 1. INTRO */
#s1{cursor:pointer;background:linear-gradient(#8fb0c9 0%,#c9d6cf 38%,#6d8f4a 55%,#4f7436 100%);overflow:hidden}
#meadow{position:absolute;left:0;right:0;bottom:0;height:52%;filter:blur(1.2px)}
#meadow i{position:absolute;border-radius:50%}
#s1 .t{position:relative;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
#s1 .dear{font-size:26px}
#s1 h1{font-size:clamp(46px,12vw,84px);line-height:1;margin:6px 0 10px;font-weight:400}
#s1 .from{font-size:22px}
#s1 .tap{display:inline-block;margin-top:26px;font:12px 'Space Mono',monospace;letter-spacing:.15em;padding:8px 16px;border:1px solid #ffffffaa;color:#ffffffcc;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.4}}
.float{position:absolute;width:56px;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(12deg)}}

/* 2. PILIH BUNGA */
#s2 h2{font-size:clamp(30px,8vw,52px);font-weight:400;margin-bottom:24px;text-align:center;padding:0 12px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;width:min(420px,92vw);justify-items:center}
.fl{width:min(82px,20vw);height:min(82px,20vw);border-radius:50%;cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .25s}
.fl:hover{transform:scale(1.08)}
.fl svg{width:88%;height:88%;filter:drop-shadow(1px 2px 2px #0002)}
.fl.sel{box-shadow:0 0 0 2px #6b4a3a inset;background:#fff6}
.fl.sel::after{content:'✓';position:absolute;top:2px;right:4px;width:16px;height:16px;border-radius:50%;background:#6b4a3a;color:#fff;font-size:10px;display:grid;place-items:center}
#cnt{margin-top:18px;font:11px 'Space Mono',monospace;letter-spacing:.2em;color:#777}

/* 3. VAS */
#stage{position:relative;width:min(360px,96vw);height:470px;margin:auto}
#vase{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84px;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translate(-50%,30px)}}
#stems{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#stems line{stroke:#5c6b3a;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1s .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;opacity:0;transform:scale(.2) rotate(-40deg);animation:pop .8s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(1px 3px 3px #0003)}
@keyframes pop{to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
#ff{position:absolute;left:8px;bottom:108px;font:12px 'Space Mono',monospace;letter-spacing:.03em;white-space:nowrap}
#mini{position:absolute;right:8px;bottom:10px;width:68px;height:48px;cursor:pointer;opacity:0;animation:fade .8s 5s forwards, wig 2.4s 6s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(5deg)}30%{transform:rotate(0)}}

/* AMPLOP KUNING */
.env{position:relative;width:100%;height:100%;perspective:900px}
.env .back{position:absolute;inset:0;background:#e6a912;border-radius:5px;box-shadow:0 6px 16px #0003}
.env .front{position:absolute;inset:0;z-index:4;background:#f5c426;border-radius:5px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;top:0;width:100%;height:60%;background:#ffd23f;z-index:6;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s ease,z-index 0s .35s}
.env.open .flap{transform:rotateX(180deg);z-index:1;background:#e6a912}
.env .seal{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#c78a00;z-index:7;box-shadow:inset 0 0 0 3px #e6a912;transition:opacity .3s}
.env.open .seal{opacity:0}

/* 4. SURAT */
#big{position:relative;top:45px;width:min(340px,86vw);height:min(230px,58vw)}
#letter{position:absolute;z-index:3;left:-4%;width:108%;top:8%;height:84%;background:#fbf3de;border-radius:3px;box-shadow:0 2px 10px #0003;text-align:center;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;gap:8px;transition:transform 1s .6s cubic-bezier(.3,1.2,.5,1)}
#big.open #letter{transform:translateY(-72%) scale(1.04)}
#letter p{font-size:12px;line-height:1.5;font-weight:300}
#letter b{font-weight:400;font-size:14px}
.pol{position:absolute;z-index:8;width:min(115px,28vw);background:#fff;padding:5px 5px 16px;box-shadow:0 4px 12px #0004;opacity:0;transform:scale(.4) rotate(0);transition:all .8s cubic-bezier(.2,1.3,.4,1);cursor:pointer}
.pol img,.pol .ph{display:block;width:100%;height:auto;max-height:135px;object-fit:contain;background:#cfcabb}
.pol .ph{display:grid;place-items:center;font:11px 'Space Mono',monospace;color:#777;text-align:center}
#s4.show .pol{opacity:1;transform:scale(1) rotate(var(--r))}
#s4{left:50%;right:auto;width:min(100vw,620px);transform:translateX(-50%)}
#mute{position:fixed;top:14px;right:14px;z-index:20;width:38px;height:38px;border-radius:50%;border:0;background:#ffffffaa;font-size:18px;cursor:pointer;box-shadow:0 1px 6px #0002}
#s4 .tip{position:absolute;bottom:18px;font:11px 'Space Mono',monospace;color:#999}
.btn{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);z-index:9;border:0;border-radius:22px;padding:10px 22px;background:#e6a912;color:#fff;font:13px 'Space Mono',monospace;letter-spacing:.08em;cursor:pointer;box-shadow:0 3px 10px #0003;opacity:0;animation:fade .7s 3.6s forwards}

/* player lagu */
#pl{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;color:#fff;background:#333}
#pl.on{display:flex;animation:fade .5s}
#pl .bg{position:absolute;inset:-60px;background:#8a8574 center/cover;filter:blur(30px) brightness(.55);transform:scale(1.1)}
#pl .in{position:relative;width:min(100vw,440px);height:100%;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 24px 22px;gap:14px}
#pl .x{position:absolute;top:14px;left:14px;width:38px;height:38px;border:0;border-radius:50%;background:#ffffff33;color:#fff;font-size:18px;cursor:pointer}
#pl .cover{width:min(74vw,290px);height:min(46vh,310px);border-radius:12px;background:transparent center/contain no-repeat;flex:none}
#pl .tt{text-align:center}#pl h3{font-size:18px;font-weight:400}#pl .tt p{opacity:.7;font-size:13px;margin-top:2px}
#pl .bar{width:100%;height:3px;background:#fff4;border-radius:3px;flex:none}#pl .bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s linear}

/* slide doa */
#s6{background:linear-gradient(#fdf7e4,#f6e4c6);overflow:hidden}
#s6 h2{font-size:clamp(34px,8vw,48px);font-weight:400;margin-bottom:18px;position:relative;z-index:2}
#wishes{display:grid;gap:12px;width:min(340px,88vw);position:relative;z-index:2}
.w{background:#fff;border-radius:12px;padding:16px;box-shadow:0 3px 10px #0002;cursor:pointer;min-height:64px;display:grid;place-items:center;text-align:center;font-size:14px;line-height:1.5;transition:background .4s}
.w.k{background:#fff2c4}
#end{position:relative;z-index:2;font-size:24px;margin:20px 0 4px;text-align:center}
#re{position:relative;z-index:2;left:auto;bottom:auto;transform:none;opacity:1;animation:none;margin-top:10px}
.pet{position:absolute;top:-80px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>

<audio id="bgm" preload="auto" playsinline></audio>
<button id="mute" style="display:none" title="musik">🔊</button>

<div class="screen on" id="s1">
  <div id="meadow"></div>
  <div class="t">
    <div class="dear hand">dear, <span id="to"></span></div>
    <h1 class="hand" id="title"></h1>
    <div class="from hand">from <span id="from"></span></div>
    <div class="tap">tap to begin</div>
  </div>
</div>

<div class="screen" id="s2">
  <h2 class="hand">Choose your flowers</h2>
  <div id="grid"></div>
  <div id="cnt">0 / 5 selected</div>
</div>

<div class="screen" id="s3">
  <div id="stage">
    <svg id="stems" viewBox="0 0 360 470"></svg>
    <svg id="vase" viewBox="0 0 84 100"><path d="M30 2h24c2 0 3 2 2 5-2 8-4 12-2 18 3 8 22 14 22 44 0 24-12 31-32 31S10 93 10 69c0-30 19-36 22-44 2-6 0-10-2-18-1-3 0-5 0-5z" fill="#3d3a8c"/><path d="M22 60c0-14 6-20 12-24" stroke="#6a67b8" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>
    <div id="ff"></div>
    <div id="mini"><div class="env"><div class="back"></div><div class="front"></div><div class="flap"></div></div></div>
  </div>
</div>
<div class="screen" id="s4">
  <div id="big" class="env">
    <div class="back"></div>
    <div class="flap"></div>
    <div id="letter"><p id="msg"></p><p class="hand" style="font-size:20px"><b>untuk Desti, dari <span id="from2"></span></b></p></div>
    <div class="front"></div>
  </div>
  <div class="pol" style="--r:-8deg;left:max(12px,calc(50% - 210px));top:max(18px,calc(50% - 285px));transition-delay:1.6s"></div>
  <div class="pol" style="--r:7deg;right:max(12px,calc(50% - 210px));top:max(18px,calc(50% - 285px));transition-delay:1.9s"></div>
  <div class="pol" style="--r:4deg;left:max(12px,calc(50% - 210px));bottom:max(88px,calc(50% - 285px));transition-delay:2.2s"></div>
  <div class="pol" style="--r:-6deg;right:max(12px,calc(50% - 210px));bottom:max(88px,calc(50% - 285px));transition-delay:2.5s"></div>
  <div class="tip">tap foto untuk melihat lagunya</div>
  <button class="btn" id="nx">lanjut ›</button>
</div>
<div id="pl"><div class="bg" id="plbg"></div><div class="in">
  <button class="x" id="plx">✕</button>
  <div class="cover" id="plcv"></div>
  <div class="tt"><h3 id="jd"></h3><p id="ar"></p></div>
  <div class="bar"><i id="pg"></i></div>
</div></div>

<div class="screen" id="s6">
  <h2 class="hand">Doa untukmu</h2>
  <div id="wishes"></div>
  <div class="hand" id="end"></div>
  <button class="btn" id="re">putar ulang ↺</button>
</div>
<script>
/* ---------- DATA (bisa diubah / lewat URL) ---------- */
const q = new URLSearchParams(location.search);
const CFG = {
  to:    q.get('to')    || 'Desti Nur Fitri Herlani',
  from:  q.get('from')  || 'Icha Nafisa',
  event: q.get('event') || 'Graduation',
  pesan: q.get('pesan') || 'Selamat wisuda S1 Kebidanan, besti! 🎉 Satu langkah besar sudah kau capai. Semangat lanjut ke pendidikan profesi — aku yakin kau akan menjadi bidan yang hebat. Semoga ilmu yang kau pelajari selalu bermanfaat untuk membantu sesama. Semangat terus, sukses selalu!'
};
/* MUSIK: taruh file lagunya di folder "musik" dengan nama restoe-boemi.mp3
   start/end = detik awal & akhir bagian refrain (end 0 = sampai lagu habis, lalu diulang) */
const MUSIK = { file:'restoe-boemi.mp3', start:+(q.get('start')||39), end:+(q.get('end')||103) }; // contoh: index.html?start=80&end=125 untuk coba-coba
/* LAGU PER FOTO: klik foto -> muncul pemutar + lirik + latar foto blur.
   file = lagu (opsional, taruh di folder musik). lirik = [[detik, 'teks baris', 'terjemahan (opsional)'], ...]  -> hasilnya dibuat oleh catat-waktu.html
   Tulis liriknya sendiri di sini ya (saya tidak bisa menuliskan lirik lagu). */
const PH=n=>Array.from({length:n},(_,i)=>[i*4,'(tempel lirik di file lirik.js)']);
const LAGU=[
 {judul:'Terima Kasih Aku',artis:'NPD',file:'videoplayback.m4a',start:0},
 {judul:'XXL',artis:'LANY',file:'XXL - LANY.mp3',start:0},
 {judul:'Ribuan Memori',artis:'Lomba Sihir',file:'Ribuan Memori - Lomba Sihir.mp3',start:0},
 {judul:'Di Atas Awan',artis:'Nidji',file:'Di Atas Awan - Nidji.mp3',start:0}
];
/* DOA di slide terakhir */
const WISHES=['Semoga lancar dan dimudahkan di pendidikan profesi ✨','Semoga jadi bidan yang sabar, teliti, dan penuh kasih 🤍','Semoga selalu sehat, bahagia, dan dikelilingi orang baik 🌷'];
const FOTO = ['foto1.jpeg','foto 2.jpeg','foto3.jpeg','foto4.jpeg'];

/* ---------- BUNGA (SVG bawaan, sudah jadi) ---------- */
const P=(n,rx,ry,d,f,s,r0=0)=>Array.from({length:n},(_,i)=>`<ellipse cx="50" cy="${50-d}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${s}" stroke-width=".7" transform="rotate(${r0+i*360/n} 50 50)"/>`).join('');
const C=(r,f,s='none')=>`<circle cx="50" cy="50" r="${r}" fill="${f}" stroke="${s}" stroke-width=".8"/>`;
const FLOWERS=[
 {n:'sunflower',s:P(18,5,16,26,'#f6c21a','#c98d00')+P(14,4,12,20,'#ffd43b','#d9a000',10)+C(14,'#6b3f12')+C(8,'#4a2a0b')},
 {n:'cosmos',s:P(8,10,19,22,'#b9dcf5','#7fb3dc')+C(6,'#fff0a8','#e0c860')},
 {n:'anthurium',s:'<path d="M50 94C12 64 6 28 29 13c12-6 21 5 21 5s9-11 21-5c23 15 17 51-21 81z" fill="#f6b5a3" stroke="#e08d7b" stroke-width=".8"/><path d="M50 62c-3-12 0-26 4-34" stroke="#f1d9a0" stroke-width="7" stroke-linecap="round" fill="none"/>'},
 {n:'orchid',s:P(5,14,22,24,'#5fc4c0','#2f8f8c')+'<ellipse cx="50" cy="50" rx="10" ry="8" fill="#f4fbfa" stroke="#bfe3e0" stroke-width=".7"/>'+C(3,'#f0a030')},
 {n:'rose',s:C(40,'#a8121a')+P(6,16,16,18,'#d2222a','#7e0a10')+C(20,'#c01a22','#7e0a10')+C(12,'#a3121a','#6b0810')+C(6,'#c01a22','#6b0810')},
 {n:'white',s:P(6,13,22,22,'#fbfbf6','#cfcfc2')+C(6,'#f3e7a8')},
 {n:'daffodil',s:P(6,10,20,22,'#fffdf2','#d8d2b8')+C(14,'#ffc61a','#d99a00')+C(8,'#f0a800')},
 {n:'peony',s:P(10,13,20,22,'#6a3fb4','#3e2278')+P(8,11,16,14,'#7e55c9','#3e2278',20)+P(6,9,11,7,'#9272d8','#4b2c8a',10)+C(5,'#4b2c8a')}
];
const svg=i=>`<svg viewBox="0 0 100 100">${FLOWERS[i].s}</svg>`;

/* ---------- LAYAR ---------- */
const $=id=>document.getElementById(id);
const go=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')};
$('to').textContent=CFG.to; $('from').textContent=CFG.from; $('from2').textContent=CFG.from;
$('title').textContent=`Happy ${CFG.event}!`; $('msg').textContent=CFG.pesan;

/* 1. padang bunga */
const m=$('meadow'),cols=['#e9d36a','#f3a6b8','#b99ae0','#fff','#8cc3f0','#e87a5d'];
for(let i=0;i<260;i++){const e=document.createElement('i'),s=3+Math.random()*7;
 e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[i%6]};opacity:${.5+Math.random()*.5}`;m.appendChild(e)}
[[78,'18%',1],[12,'62%',3]].forEach(([l,t,i])=>{const d=document.createElement('div');d.className='float';d.style.cssText=`left:${l}%;top:${t}`;d.innerHTML=svg(i);$('s1').appendChild(d)});
const bgm=$('bgm'),mute=$('mute');
const note=m=>{let n=$('note');if(!n){n=document.createElement('div');n.id='note';n.style.cssText='position:fixed;left:10px;right:60px;top:12px;z-index:30;background:#fff;color:#b00020;font:12px/1.4 sans-serif;padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px #0003';document.body.appendChild(n)}n.textContent=m;setTimeout(()=>n.remove(),9000)};
let started=false;
bgm.src=MUSIK.file;bgm.preload='auto';
bgm.addEventListener('error',()=>{mute.style.display='block';mute.textContent='\u26A0\uFE0F';note('Lagu tidak ketemu / gagal dimuat: '+MUSIK.file+' \u2014 cek nama file & folder "musik" (harus sejajar dengan index.html).')});
bgm.addEventListener('timeupdate',()=>{if(MUSIK.end&&bgm.currentTime>=MUSIK.end)bgm.currentTime=MUSIK.start});
bgm.addEventListener('ended',()=>{bgm.currentTime=MUSIK.start;bgm.play().catch(()=>{})});
mute.onclick=e=>{e.stopPropagation();if(bgm.error){bgm.load();}bgm.paused?bgm.play().catch(()=>{}):bgm.pause();setTimeout(()=>{mute.textContent=bgm.paused?'\uD83D\uDD07':'\uD83D\uDD0A'},100)};
function startMusic(){
  const go2=()=>{try{bgm.currentTime=MUSIK.start}catch(e){}
    bgm.play().then(()=>{started=true;mute.style.display='block';mute.textContent='\uD83D\uDD0A'}).catch(err=>{if(!bgm.error){mute.style.display='block';mute.textContent='\uD83D\uDD07';note('Browser menahan musik. Tekan tombol \uD83D\uDD07 di kanan atas.')}})};
  if(bgm.readyState>=1)go2();else{bgm.addEventListener('loadedmetadata',go2,{once:true});bgm.load();}
}
$('s1').onclick=()=>{startMusic();go('s2')};

/* 2. pilih bunga */
const picked=[];
FLOWERS.forEach((f,i)=>{const d=document.createElement('div');d.className='fl';d.innerHTML=svg(i);
 d.onclick=()=>{
  if(picked.includes(i)){picked.splice(picked.indexOf(i),1);d.classList.remove('sel')}
  else if(picked.length<5){picked.push(i);d.classList.add('sel')}
  $('cnt').textContent=`${picked.length} / 5 selected`;
  if(picked.length===5)setTimeout(bouquet,900)};
 $('grid').appendChild(d)});

/* 3. buket */
const SLOT=[[-70,-70,-12],[0,-150,0],[70,-72,12],[-34,-112,-6],[36,-114,8]]; // x,y relatif ke mulut vas, rotasi
function bouquet(){
  go('s3');const st=$('stage'),cx=180,my=470-92;
  $('stems').innerHTML=SLOT.map(([x,y])=>`<line x1="${cx}" y1="${my}" x2="${cx+x}" y2="${my+y}"/>`).join('');
  document.querySelectorAll('.pop').forEach(e=>e.remove());
  picked.forEach((fi,k)=>{const [x,y,r]=SLOT[k],d=document.createElement('div');
   d.className='pop';d.style.cssText=`left:${cx+x}px;top:${my+y}px;--r:${r}deg;animation-delay:${1+k*.55}s`;d.innerHTML=svg(fi);st.appendChild(d)});
  const t='flowers for you!';$('ff').textContent='';
  setTimeout(()=>{let i=0;const iv=setInterval(()=>{$('ff').textContent=t.slice(0,++i);if(i>=t.length)clearInterval(iv)},90)},4000);
}
$('mini').onclick=()=>{
  go('s4');const s4=$('s4'),big=$('big');s4.classList.remove('show');big.classList.remove('open');
  document.querySelectorAll('#s4 .pol').forEach((p,i)=>{p.innerHTML=`<img src="${FOTO[i]}" alt=""><div class="ph" style="display:none">foto ${i+1}<br>(taruh di folder foto)</div>`;
   const im=p.querySelector('img');im.onerror=()=>{im.style.display='none';p.querySelector('.ph').style.display='grid'}});
  setTimeout(()=>{big.classList.add('open');s4.classList.add('show')},600);
};

/* ---- pemutar lagu ---- */
const sa=new Audio();let tick=null,t0=0,cur=null,bgmWas=false;
function openPlayer(i){
  const d=LAGU[i];
  const u='url("'+FOTO[i]+'")';$('plbg').style.backgroundImage=u;$('plcv').style.backgroundImage=u;
  $('jd').textContent=d.judul;$('ar').textContent=d.artis;
  $('pg').style.width='0%';
  $('pl').classList.add('on');
  bgmWas=!bgm.paused;let real=false;
  if(d.file){
    sa.onerror=()=>{real=false};
    sa.onloadedmetadata=()=>{try{sa.currentTime=d.start||0}catch(e){}};
    sa.src=d.file;
    sa.play().then(()=>{real=true;if(bgmWas)bgm.pause()}).catch(()=>{real=false});
  }
  t0=Date.now();
  clearInterval(tick);tick=setInterval(()=>{
    const live=real&&!sa.paused;
    const t=live?Math.max(0,sa.currentTime-(d.start||0)):(Date.now()-t0)/1000;
    const total=live&&isFinite(sa.duration)?sa.duration-(d.start||0):200;
    $('pg').style.width=Math.min(100,t/total*100)+'%';
  },250);
}
function closePlayer(){clearInterval(tick);sa.pause();$('pl').classList.remove('on');if(bgmWas)bgm.play().catch(()=>{})}
$('plx').onclick=closePlayer;
document.querySelectorAll('#s4 .pol').forEach((p,i)=>p.addEventListener('click',e=>{e.stopPropagation();openPlayer(i)}));

/* ---- slide doa ---- */
$('nx').onclick=()=>{go('s6');
  const w=$('wishes');w.innerHTML='';
  WISHES.forEach((t,i)=>{const d=document.createElement('div');d.className='w';d.textContent='💌 buka doa ke-'+(i+1);
    d.onclick=()=>{d.textContent=t;d.classList.add('k');
      if(document.querySelectorAll('.w.k').length===WISHES.length)setTimeout(()=>{$('end').textContent='Selamat melangkah ke chapter baru, bu bidan! 🩺'},700)};
    w.appendChild(d)});
  $('end').textContent='';
  document.querySelectorAll('.pet').forEach(e=>e.remove());
  for(let i=0;i<14;i++){const d=document.createElement('div');d.className='pet';
    d.style.cssText='left:'+Math.random()*95+'%;width:'+(26+Math.random()*20)+'px;animation-duration:'+(7+Math.random()*7)+'s;animation-delay:-'+Math.random()*10+'s';
    d.innerHTML=svg(Math.floor(Math.random()*8));$('s6').appendChild(d)}
};
$('re').onclick=()=>location.reload();
</script>
